#
# Squid 4.14 (Diladele / Windows) 設定 - 正本は https://github.com/take566/proxy の squid/squid.conf
# 配備: scripts/deploy-config.ps1  (D:\Squid\etc\squid\squid.conf へコピー → parse → サービス再起動)
# パスは Cygwin 表記。ルート / = D:\Squid
#

# ---------------------------------------------------------------------------
# アクセス制御
# ---------------------------------------------------------------------------
acl localnet src 10.0.0.0/8		# RFC1918 possible internal network
acl localnet src 172.16.0.0/12		# RFC1918 possible internal network
acl localnet src 192.168.0.0/16		# RFC1918 possible internal network
acl localnet src fc00::/7		# RFC 4193 local private network range
acl localnet src fe80::/10		# RFC 4291 link-local (directly plugged) machines

acl SSL_ports port 443
acl Safe_ports port 80			# http
acl Safe_ports port 21			# ftp
acl Safe_ports port 443			# https
acl Safe_ports port 70			# gopher
acl Safe_ports port 210			# wais
acl Safe_ports port 1025-65535		# unregistered ports
acl Safe_ports port 280			# http-mgmt
acl Safe_ports port 488			# gss-http
acl Safe_ports port 591			# filemaker
acl Safe_ports port 777			# multiling http
acl CONNECT method CONNECT

http_access allow localhost manager
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access allow localhost
http_access deny all

# ---------------------------------------------------------------------------
# 待受 + SSL Bump (HTTPS 復号 → キャッシュ可能にする)
#   CA は scripts/gen-ca.ps1 で生成し D:\Squid\etc\squid\ssl\ に置く (リポジトリには含めない)
# ---------------------------------------------------------------------------
http_port 3128 ssl-bump \
	generate-host-certificates=on \
	dynamic_cert_mem_cache_size=16MB \
	tls-cert=/etc/squid/ssl/squid-ca.pem \
	tls-key=/etc/squid/ssl/squid-ca.key

# 動的サーバ証明書生成ヘルパー (DB は scripts/init-storage.ps1 で初期化)
sslcrtd_program /lib/squid/security_file_certgen -s /var/cache/squid_ssldb -M 16MB
sslcrtd_children 5 startup=1 idle=1

# SNI を読んでから判定: nobump.txt に載るドメインは splice (復号しない)、それ以外は bump
acl step1 at_step SslBump1
acl nobump ssl::server_name "/etc/squid/nobump.txt"
ssl_bump peek step1
ssl_bump splice nobump
ssl_bump bump all

# 上流サーバ証明書の検証用 CA バンドル (Mozilla) — scripts/update-cacert.ps1 で取得/更新
tls_outgoing_options cafile=/etc/squid/ssl/cacert.pem
# 上流の証明書エラーは既定 (deny) のまま通さない
# sslproxy_cert_error deny all

# ---------------------------------------------------------------------------
# キャッシュ
# ---------------------------------------------------------------------------
cache_mem 256 MB
maximum_object_size_in_memory 4 MB
maximum_object_size 512 MB
cache_dir ufs /var/cache/squid 4096 16 256
coredump_dir /var/cache/squid
cache_swap_low 90
cache_swap_high 95

# HTTPS レスポンスでも Cache-Control に従って通常どおりキャッシュする
cache allow all

# ---------------------------------------------------------------------------
# refresh_pattern (上から順に最初にマッチしたものが適用される)
# ---------------------------------------------------------------------------
refresh_pattern ^ftp:		1440	20%	10080
refresh_pattern ^gopher:	1440	0%	1440
refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
# 静的アセット: Expires 無しでも 1 週間 (min) 〜 30 日 (max) 保持
refresh_pattern -i \.(jpe?g|png|gif|webp|svg|ico|bmp)$		10080	90%	43200	override-expire
refresh_pattern -i \.(css|js|mjs|woff2?|ttf|otf|eot)$		10080	90%	43200	override-expire
refresh_pattern -i \.(zip|7z|gz|bz2|xz|tar|tgz|rar|iso|msi|exe|dmg|deb|rpm|whl|nupkg)$	10080	90%	43200	override-expire
refresh_pattern -i \.(mp3|mp4|m4a|ogg|webm|mkv|avi|flac)$	10080	90%	43200	override-expire
refresh_pattern .		0	20%	4320

# ---------------------------------------------------------------------------
# その他 (Diladele 既定を踏襲)
# ---------------------------------------------------------------------------
dns_nameservers 8.8.8.8 208.67.222.222
max_filedescriptors 3200
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid.pid
shutdown_lifetime 3 seconds
visible_hostname squid-win
